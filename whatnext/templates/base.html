<!DOCTYPE html>
<html>
    <head>
        <title>WhatNext</title>
        
        <!-- Bootstrap 5 CSS-->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body>
        {% if user.is_authenticated %}      
            <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">    
                <a class="navbar-brand" href="{% url 'catalog:media_list' %}">WhatNext</a>
                <span class="navbar-text me-3">Hello, {{ user.username }}!</span>

                <a href="{% url 'catalog:media_list' %}" class="nav-link me-3">Media Catalog</a>
                <a href="{% url 'catalog:my_backlog' %}" class="nav-link me-3">My Backlog</a>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Log Out</button>
                </form>
            </nav>                
            {% else %}  
                <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
                    <a class="navbar-brand">WhatNext</a>
                </nav>
            {% endif %}
        </nav>
        <main>
            {% if messages %}
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
