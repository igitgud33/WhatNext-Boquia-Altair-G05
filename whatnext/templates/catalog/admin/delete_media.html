
{% extends "base.html" %}

{% block title %}Delete Media - WhatNext{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="mb-3">Delete Media</h2>

                    <p>Are you sure you want to delete <strong>{{ media.title }}</strong>?</p>

                    <p class="text-danger small">Warning: This will also remove this item from every
                        user's backlog and cannot be undone.</p>

                    <form method="POST">
                        {% csrf_token%}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a href="{% url 'catalog:media_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
