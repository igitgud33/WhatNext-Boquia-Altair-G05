{% extends "base.html" %}

{% block title %}Edit My Review - WhatNext{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="text-center mb-2">Reviews</h2>

                    <p class="text-center text-muted mb-4">{{ entry.media.title }}</p>
                    <form method="POST">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'catalog:my_backlog %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
